services:
  - type: web
    name: plutos-rebates
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --chdir app server:app --workers 2 --threads 4 --timeout 300 --bind 0.0.0.0:$PORT
    disk:
      name: dados
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: PLUTOS_SENHA
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: PLUTOS_TOKEN
        generateValue: true
      - key: TZ
        value: America/Sao_Paulo
      - key: PYTHON_VERSION
        value: "3.11.9"
